[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-adk-personal-agent"
version = "0.1.0"
description = "Independent Google ADK personal agent integrated through AgentGuard SDK."
requires-python = ">=3.11"
dependencies = [
    "agentguard-sdk>=0.1.0",
    "google-adk>=2.1.0",
    "mcp>=1.27.1",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
agentguard-sdk = { path = "../agentguard-product/packages/agentguard-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
