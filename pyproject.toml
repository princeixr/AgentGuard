[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Trace-conditioned runtime governance for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "agent-trust @ git+https://github.com/chenglin1112/AgentTrust.git@aee262344315e29b4d0a9e23eb180af9b8193d6b",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
agentguard-api = "agentguard.server.cli:main"

[project.optional-dependencies]
dev = [
    "google-adk>=2.1.0",
    "google-genai>=1.75.0",
    "mcp>=1.27.1",
    "pytest>=8.0",
    "ruff>=0.4",
]
adk = [
    "google-adk>=2.1.0",
    "mcp>=1.27.1",
]
gemini = [
    "google-genai>=1.75.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
