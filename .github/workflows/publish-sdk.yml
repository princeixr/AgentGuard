name: Publish SDK

on:
  push:
    tags: ['sdk-v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build SDK distribution
        run: |
          python -m pip install --upgrade build
          python -m build agentguard-product/packages/agentguard-sdk
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agentguard-product/packages/agentguard-sdk/dist
