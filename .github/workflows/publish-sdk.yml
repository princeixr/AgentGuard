name: Publish SDK

on:
  push:
    tags: ['sdk-v*.*.*', 'google-adk-v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build SDK distribution
        if: startsWith(github.ref_name, 'sdk-v')
        run: |
          python -m pip install --upgrade build
          python -m build agentguard-product/packages/agentguard-sdk
      - name: Publish to PyPI
        if: startsWith(github.ref_name, 'sdk-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agentguard-product/packages/agentguard-sdk/dist
      - name: Build Google ADK adapter distribution
        if: startsWith(github.ref_name, 'google-adk-v')
        run: |
          python -m pip install --upgrade build
          python -m build agentguard-product/packages/agentguard-google-adk
      - name: Publish Google ADK adapter to PyPI
        if: startsWith(github.ref_name, 'google-adk-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agentguard-product/packages/agentguard-google-adk/dist
