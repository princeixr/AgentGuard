name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e agentguard-product/packages/agentguard-sdk
          pip install -e 'agentguard-product[dev]'
      - name: Test backend
        working-directory: agentguard-product
        run: PYTHONPATH=src:packages/agentguard-sdk/src pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentguard-product/apps/agentguard_dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --prefix agentguard-product/apps/agentguard_dashboard
      - name: Test dashboard
        run: npm --prefix agentguard-product/apps/agentguard_dashboard test
      - name: Build dashboard
        run: npm --prefix agentguard-product/apps/agentguard_dashboard run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: agentguard-product
          file: agentguard-product/Dockerfile.api
          push: false
          tags: agentguard-api:ci
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: agentguard-product
          file: agentguard-product/Dockerfile.dashboard
          push: false
          tags: agentguard-dashboard:ci

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint agentguard-product/charts/agentguard
