name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Check backend lockfile
        run: uv lock --project agentguard-product --check
      - name: Install backend and SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e agentguard-product/packages/agentguard-sdk
          pip install -e agentguard-product/packages/agentguard-google-adk
          pip install -e 'agentguard-product[dev]'
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - name: Test backend when present
        working-directory: agentguard-product
        run: |
          set +e
          PYTHONPATH=src:packages/agentguard-sdk/src pytest -q
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "::notice::No backend tests were collected; skipping this optional check."
            exit 0
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentguard-product/apps/agentguard_dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --prefix agentguard-product/apps/agentguard_dashboard
      - name: Test dashboard
        run: npm --prefix agentguard-product/apps/agentguard_dashboard test
      - name: Build dashboard
        run: npm --prefix agentguard-product/apps/agentguard_dashboard run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: agentguard-product
          file: agentguard-product/Dockerfile.api
          push: false
          load: true
          tags: agentguard-api:ci
      - name: Generate API image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: agentguard-api:ci
          format: spdx-json
          artifact-name: agentguard-api-sbom.spdx.json
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: agentguard-product
          file: agentguard-product/Dockerfile.dashboard
          push: false
          load: true
          tags: agentguard-dashboard:ci
      - name: Generate dashboard image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: agentguard-dashboard:ci
          format: spdx-json
          artifact-name: agentguard-dashboard-sbom.spdx.json

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint agentguard-product/charts/agentguard \
            --set secrets.agentguardApiKey=ci-agentguard-api-key-strong-value \
            --set secrets.agentguardApiKeyPepper=ci-agentguard-pepper-strong-value \
            --set postgresql.password=ci-postgres-password-strong-value \
            --set redis.password=ci-redis-password-strong-value \
            --set config.webOrigins=https://agentguard.example.com
