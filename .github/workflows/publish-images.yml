name: Publish Images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/agentguard-api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/agentguard-dashboard

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: agentguard-product
          file: agentguard-product/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.ref_name }}
            ${{ env.API_IMAGE }}:latest
      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: agentguard-product
          file: agentguard-product/Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ github.ref_name }}
            ${{ env.DASHBOARD_IMAGE }}:latest
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.API_IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          artifact-name: agentguard-api-sbom.spdx.json
      - name: Generate dashboard SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DASHBOARD_IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          artifact-name: agentguard-dashboard-sbom.spdx.json
      - name: Sign images
        run: |
          cosign sign --yes "${API_IMAGE}:${GITHUB_REF_NAME}"
          cosign sign --yes "${API_IMAGE}:latest"
          cosign sign --yes "${DASHBOARD_IMAGE}:${GITHUB_REF_NAME}"
          cosign sign --yes "${DASHBOARD_IMAGE}:latest"
