[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-sdk"
version = "0.1.0"
description = "Framework-neutral contracts and clients for AgentGuard integrations."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]
