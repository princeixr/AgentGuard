[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Trace-conditioned runtime governance for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Nandan Prince" },
    { name = "Ayman Sayed" },
    { name = "Aditya Patil" },
    { name = "Adithya NJ" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "agent-trust @ git+https://github.com/chenglin1112/AgentTrust.git@aee262344315e29b4d0a9e23eb180af9b8193d6b",
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "redis>=5.0",
    "starlette>=1.0.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
agentguard-api = "agentguard.server.cli:main"
agentguard-create-api-key = "agentguard.server.db.cli:create_api_key_command"

[project.optional-dependencies]
dev = [
    "google-genai>=1.75.0",
    "pytest>=8.0",
    "ruff>=0.4",
]
gemini = [
    "google-genai>=1.75.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
