replicaCount: 1

image:
  api:
    repository: ghcr.io/your-org/agentguard-api
    tag: latest
    pullPolicy: IfNotPresent
  dashboard:
    repository: ghcr.io/your-org/agentguard-dashboard
    tag: latest
    pullPolicy: IfNotPresent

service:
  api:
    type: ClusterIP
    port: 8000
  dashboard:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: agentguard.local
  tls: []

config:
  agentguardEnv: production
  requireAuth: "true"
  docsEnabled: "false"
  webOrigins: ""
  traceNamespace: registered_agents
  registeredAgentsPath: /app/demo/registered_agents.json
  policyPath: /app/policies/personal_assistant_v1.json
  elasticEnabled: "false"
  cacheEnabled: "true"
  rateLimitEnabled: "true"
  rateLimitPerMinute: "300"
  idempotencyTtlSeconds: "900"
  approvalCacheTtlSeconds: "3600"
  firewallMode: v2
  agenttrustShellEnabled: "true"
  intentLlmEnabled: "false"
  tier3Model: gemini-2.5-flash

secrets:
  existingSecret: ""
  agentguardApiKey: ""
  agentguardApiKeyPepper: ""
  googleApiKey: ""

postgresql:
  enabled: true
  image: postgres:16-alpine
  database: agentguard
  username: agentguard
  password: ""
  existingSecret: ""
  host: ""
  port: 5432
  databaseUrl: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

redis:
  enabled: true
  image: redis:7-alpine
  host: ""
  port: 6379
  database: 0
  password: ""
  existingSecret: ""
  redisUrl: ""
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""

resources:
  api: {}
  dashboard: {}

nodeSelector: {}
tolerations: []
affinity: {}
