apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentguard.fullname" . }}-config
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
data:
  AGENTGUARD_WEB_ORIGINS: {{ .Values.config.webOrigins | quote }}
  AGENTGUARD_TRACE_ROOT: "/data/traces"
  AGENTGUARD_TRACE_NAMESPACE: {{ .Values.config.traceNamespace | quote }}
  AGENTGUARD_APPROVAL_ROOT: "/data/approvals"
  AGENTGUARD_ELASTIC_ENABLED: {{ .Values.config.elasticEnabled | quote }}
  AGENTGUARD_FIREWALL_MODE: {{ .Values.config.firewallMode | quote }}
  AGENTGUARD_AGENTTRUST_SHELL_ENABLED: {{ .Values.config.agenttrustShellEnabled | quote }}
  AGENTGUARD_INTENT_LLM_ENABLED: {{ .Values.config.intentLlmEnabled | quote }}
  AGENTGUARD_TIER3_MODEL: {{ .Values.config.tier3Model | quote }}
