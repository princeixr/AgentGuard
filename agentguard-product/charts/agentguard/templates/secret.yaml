{{- if not .Values.secrets.existingSecret }}
{{- $apiKey := required "Set secrets.agentguardApiKey or secrets.existingSecret" .Values.secrets.agentguardApiKey -}}
{{- $apiKeyPepper := required "Set secrets.agentguardApiKeyPepper or secrets.existingSecret" .Values.secrets.agentguardApiKeyPepper -}}
{{- $postgresPassword := .Values.postgresql.password -}}
{{- if and (not .Values.postgresql.databaseUrl) (or .Values.postgresql.enabled .Values.postgresql.host) -}}
{{- $postgresPassword = required "Set postgresql.password, postgresql.databaseUrl, or secrets.existingSecret" .Values.postgresql.password -}}
{{- end -}}
{{- $redisPassword := .Values.redis.password -}}
{{- if and (not .Values.redis.redisUrl) (or .Values.redis.enabled .Values.redis.host) -}}
{{- $redisPassword = required "Set redis.password, redis.redisUrl, or secrets.existingSecret" .Values.redis.password -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentguard.fullname" . }}-secret
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENTGUARD_API_KEY: {{ $apiKey | quote }}
  AGENTGUARD_API_KEY_PEPPER: {{ $apiKeyPepper | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  {{- if .Values.postgresql.databaseUrl }}
  AGENTGUARD_DATABASE_URL: {{ .Values.postgresql.databaseUrl | quote }}
  {{- else if .Values.postgresql.enabled }}
  AGENTGUARD_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:%v/%s" .Values.postgresql.username $postgresPassword (include "agentguard.fullname" .) .Values.postgresql.port .Values.postgresql.database | quote }}
  {{- else if .Values.postgresql.host }}
  AGENTGUARD_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgresql.username $postgresPassword .Values.postgresql.host .Values.postgresql.port .Values.postgresql.database | quote }}
  {{- end }}
  {{- if .Values.redis.redisUrl }}
  AGENTGUARD_REDIS_URL: {{ .Values.redis.redisUrl | quote }}
  {{- else if .Values.redis.enabled }}
  AGENTGUARD_REDIS_URL: {{ printf "redis://:%s@%s-redis:%v/%v" $redisPassword (include "agentguard.fullname" .) .Values.redis.port .Values.redis.database | quote }}
  {{- else if .Values.redis.host }}
  AGENTGUARD_REDIS_URL: {{ printf "redis://:%s@%s:%v/%v" $redisPassword .Values.redis.host .Values.redis.port .Values.redis.database | quote }}
  {{- end }}
{{- end }}
